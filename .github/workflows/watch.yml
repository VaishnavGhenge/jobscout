name: Watch for new postings

# Runs tools/watch so phone alerts keep coming with the laptop shut.
#
# GitHub treats schedules as best-effort and drops most ticks on a free public
# repo: at */10 it ran 16 times in four days, and hourly at minute 17 ran 3
# times in 26 hours. So the real clock is cron-job.org, which calls the
# workflow_dispatch API every 15 minutes with a fine-grained token scoped to
# this repo (Actions: write). The schedule below stays as a fallback in case
# that service stops. The LinkedIn searches look back 12 hours (searches.json)
# so even a long gap misses nothing; seen ids are remembered, so the overlap
# never re-alerts.
# GitHub also disables schedules on a public repo after 60 days without a
# commit.
#
# The repo is public, so the logs are too. The watcher prints counts only when
# CI is set, never which roles it alerted on. NTFY_TOPIC and DATABASE_URL are
# secrets; the topic name is what keeps the phone feed private.
#
# Which job ids have already been seen lives in the Actions cache: restored
# from the newest entry, saved under a fresh key each run (cache keys are
# immutable). If the cache is ever evicted, the next run reseeds silently
# rather than alerting on everything at once.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore seen-job state
        uses: actions/cache/restore@v4
        with:
          path: ~/.jobscout
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: Check boards and LinkedIn
        run: pnpm run watch:build && node tools/watch/dist/watch.mjs
        env:
          CI: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save seen-job state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.jobscout
          key: watch-state-${{ github.run_id }}
